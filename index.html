<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Sim</title>
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="src/ui/ui.css">
  <link rel="stylesheet" href="src/ui/logbook.css">
  <link rel="stylesheet" href="src/ui/menu.css">
  <link rel="stylesheet" href="src/ui/sky-window.css">
</head>
<body>
  <div id="app">
    <canvas id="view" tabindex="-1"></canvas>
    <div id="hud"></div>
    <div id="map-root"></div>
    <div id="setup-root"></div>

    <div id="fade"></div>
    <div id="toast" hidden></div>
    <div id="perf" hidden></div>

    <div id="loading" class="panel center">
      <h1>Flight Sim</h1>
      <p id="loading-text">Loading the world…</p>
      <p class="small" data-version></p>
    </div>

    <div id="pause" class="panel center" hidden>
      <h2>Paused</h2>
      <p class="small" id="pause-scenario"></p>
      <div class="buttons pause-buttons">
        <button data-act="resume" class="primary">Resume</button>
        <button data-act="save">Save</button>
        <button data-act="copy" title="This moment as a new scenario, to fly on from it again. You keep flying this one">Save a copy</button>
        <button data-act="logbook">Logbook</button>
        <button data-act="rewind">Rewind 30 s</button>
        <button data-act="restart">Restart the flight</button>
        <button data-act="setup">New flight</button>
        <button data-act="settings">Settings</button>
        <button data-act="controls">Controls</button>
        <button data-act="sky" data-sky>Time of day (L)</button>
        <button data-act="weight" title="Passengers, cargo and fuel, changed now">Weight and fuel</button>
        <button data-act="menu">Exit to menu</button>
      </div>
      <p class="small"><span data-version></span></p>
    </div>

    <div id="crash" class="panel center" hidden>
      <h2>Crashed</h2>
      <p id="crash-reason"></p>
      <p class="crash-hint">Practising? Indestructible keeps a crash from ending the flight (Settings turns it off again).</p>
      <div class="buttons">
        <button data-act="rewind">Rewind 30 s</button>
        <button data-act="rewind-ind">Rewind 30 s with Indestructible on</button>
        <button data-act="restart">Restart the flight</button>
        <button data-act="setup">New flight</button>
        <button data-act="menu">Exit to menu</button>
      </div>
    </div>

    <div id="score" hidden></div>
    <div id="menu-root"></div>
    <div id="logbook-root"></div>
    <div id="pages-root"></div>
    <div id="skywin-root"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
